image: eclipse-temurin:17.0.14_7-jdk@sha256:1ebe50132ef974b48c850acf45f15be971b28d7a4d2c85849ceb26d782e74983

include:
  # GradleProperties has not been loaded yet.
  # - template: Dependency-Scanning.gitlab-ci.yml
  # Try again later.
  # - template: SAST.gitlab-ci.yml
  # - template: DAST.gitlab-ci.yml

variables:
  GRADLE_USER_HOME: ".gradle"
#   SAST_DISABLE_DIND: "true"
#   DAST_WEBSITE: http://localhost:8283/

cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

stages:
#FIXME report is empty
#TODO how to properly upload report for gitlab ui?
#  - license_scanning
  - test
  - build

#license_scanning:
#  stage: license_scanning
#  artifacts:
#    reports:
#      license_scanning: gl-license-scanning-report.json

test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    reports:
      junit: build/test-results/test/TEST-*.xml

build:
  stage: build
  script:
    - ./gradlew distTar
    - tar -xf build/distributions/blacknet-*.*.*.tar
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  artifacts:
    name: blacknet-gitlab-build
    paths:
      - blacknet-*.*.*
